name: zayaluxe

# Local development stack only. Production lives in docker-compose.prod.yml on the
# single EC2 host behind Caddy (architecture.md §4, ADR-010).
# Credentials here are throwaway local values — never reuse them anywhere else.

services:
  postgres:
    image: postgres:16-alpine
    container_name: zayaluxe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaya
      POSTGRES_PASSWORD: zaya
      POSTGRES_DB: zayaluxe
      # Deterministic collation for consistent sort order across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaya -d zayaluxe"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: zayaluxe-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: zayaluxe-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
  meilidata:
